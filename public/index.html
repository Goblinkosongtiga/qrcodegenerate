<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Generator QR Code gratis - buat QR code dari link/URL dengan mudah, tanpa database, 100% di browser." />
    <title>QR Code Generator — Gratis & Tanpa Database</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>" />
</head>
<body>
    <main class="container">
        <header>
            <h1>🔗 QR Code Generator</h1>
            <p class="subtitle">Buat QR Code dari link/URL — gratis, cepat, tanpa database</p>
        </header>

        <!-- Input Section -->
        <section class="input-section">
            <label for="urlInput" class="sr-only">Masukkan URL</label>
            <input
                type="text"
                id="urlInput"
                placeholder="https://contoh.com atau contoh.com"
                autocomplete="url"
                spellcheck="false"
            />
            <div class="btn-group">
                <button id="generateBtn" class="btn-primary">Generate QR</button>
                <button id="resetBtn" class="btn-secondary">Reset</button>
            </div>
        </section>

        <!-- Options Section -->
        <details class="options-section" open>
            <summary>⚙️ Opsi Desain & Warna</summary>
            <div class="options-grid">
                <div class="option">
                    <label for="sizeSelect">Ukuran</label>
                    <select id="sizeSelect">
                        <option value="200">200 × 200</option>
                        <option value="256" selected>256 × 256</option>
                        <option value="320">320 × 320</option>
                        <option value="400">400 × 400</option>
                        <option value="512">512 × 512</option>
                    </select>
                </div>
                <div class="option">
                    <label for="errorLevel">Error Correction</label>
                    <select id="errorLevel">
                        <option value="L">L (7%)</option>
                        <option value="M">M (15%)</option>
                        <option value="Q">Q (25%)</option>
                        <option value="H" selected>H (30%)</option>
                    </select>
                </div>
            </div>

            <!-- Palet Warna Instan -->
            <div class="color-palette">
                <span>Preset Warna:</span>
                <div class="palette-buttons">
                    <button class="color-btn" data-dark="#000000" data-light="#ffffff" style="background: #000; border: 1px solid #ccc;" title="Hitam Putih"></button>
                    <button class="color-btn" data-dark="#1e3a8a" data-light="#eff6ff" style="background: #1e3a8a;" title="Biru"></button>
                    <button class="color-btn" data-dark="#065f46" data-light="#ecfdf5" style="background: #065f46;" title="Hijau"></button>
                    <button class="color-btn" data-dark="#9d174d" data-light="#fdf2f8" style="background: #9d174d;" title="Merah Muda"></button>
                    <button class="color-btn" data-dark="#b45309" data-light="#fffbeb" style="background: #b45309;" title="Oranye"></button>
                    <button class="color-btn" data-dark="#3b0764" data-light="#faf5ff" style="background: #3b0764;" title="Ungu"></button>
                </div>
            </div>

            <!-- Custom Warna -->
            <div class="options-grid" style="margin-top: 15px;">
                <div class="option">
                    <label for="colorDark">Warna QR</label>
                    <input type="color" id="colorDark" value="#000000" />
                </div>
                <div class="option">
                    <label for="colorLight">Warna Latar</label>
                    <input type="color" id="colorLight" value="#ffffff" />
                </div>
            </div>
        </details>

        <!-- QR Display -->
        <section class="qr-display" id="qrContainer">
            <span class="placeholder">QR Code akan muncul di sini</span>
        </section>

        <!-- Action Buttons -->
        <div class="btn-group download-group">
            <button id="downloadPngBtn" class="btn-success" disabled>⬇️ Download PNG</button>
            <button id="copyUrlBtn" class="btn-secondary" disabled>📋 Copy URL</button>
        </div>

        <!-- History Section -->
        <section class="history-section" id="historySection" hidden>
            <div class="history-header">
                <h2>Riwayat Terakhir</h2>
                <button id="downloadHistoryBtn" class="btn-text" style="color: #667eea; text-decoration: none; font-weight: bold;">⬇️ Simpan ke riwayat.txt</button>
            </div>
            <ul id="historyList"></ul>
            <button id="clearHistoryBtn" class="btn-text">Hapus riwayat lokal</button>
        </section>
    </main>

    <footer>
        <p>Dibuat dengan ❤️ · <a href="https://github.com/" target="_blank" rel="noopener">TUAKIA R</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
